name: Train Japanese Model (KNBC)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          uv sync --locked --extra jaxcpu
      - name: Prepare KNBC data
        run: |
          curl -o knbc.tar.bz2 https://nlp.ist.i.kyoto-u.ac.jp/kuntt/KNBC_v1.0_090925_utf8.tar.bz2
          tar -xf knbc.tar.bz2
          uv run python scripts/prepare_knbc.py KNBC_v1.0_090925_utf8 -o source_knbc.txt
      - name: Encode data
        run: uv run python scripts/encode_data.py source_knbc.txt -o encoded_knbc.txt
      - name: Train model
        run: |
          echo "Starting training..."
          start_time=$(date +%s)
          uv run python scripts/train.py encoded_knbc.txt -o weights_knbc.txt --iter 100000
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Training finished."
          echo "Duration: $duration seconds"
          echo "Duration: $(($duration / 60)) minutes and $(($duration % 60)) seconds"
      - name: Build model
        run: uv run python scripts/build_model.py weights_knbc.txt -o model.json
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budoux-ja-knbc-model
          path: model.json
