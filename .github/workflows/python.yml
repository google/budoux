name: Python CI
on:
  push:
    branches: [ "main" ]
    paths:
      - 'budoux/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'budoux/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Harden Runner
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra jaxcpu
      - name: Run style checks
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version != '3.11' }}
        run: |
          uv run ruff format --check .
          uv run pyrefly check
          uv run ruff check
          uv run python scripts/lint_data.py
      - name: Run unittest
        run: uv run pytest ./tests
      - name: Run unittest with Jax
        if: ${{ matrix.os != 'windows-latest' && matrix.python-version != '3.11' }}
        run: uv run pytest ./scripts/tests
