name: Unittest for Python
on:
  push:
    paths-ignore:
      - 'javascript/**'
      - 'java/**'
  pull_request:
    paths-ignore:
      - 'javascript/**'
      - 'java/**'
permissions:
  contents: read

jobs:
  python-unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: uv sync --locked --extra dev --extra jaxcpu
      - name: Run unittest
        run: uv run pytest ./tests
      - name: Run unittest with Jax
        if: ${{ matrix.os != 'windows-latest' && matrix.python-version != '3.11' && matrix.python-version != '3.15' }}
        run: uv run pytest ./scripts/tests
