[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budoux"
dynamic = ["version"]
description = "BudouX is the successor of Budou"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Shuhei Iitsuka", email = "tushuhei@google.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = []

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"

[project.optional-dependencies]
jaxcpu = [
    "jax>=0.9.0; python_version >= '3.12'",
]
dev = [
    "google-genai",
    "pydantic",
    "pytest",
    "regex",
    "types-regex",
    "jax>=0.9.0; python_version >= '3.12'",
    "pyrefly>=1.2.0",
    "ruff>=0.16.2",
]

[project.scripts]
budoux = "budoux.main:main"

[tool.setuptools.dynamic]
version = {attr = "budoux.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["budoux*"]

[tool.setuptools.package-data]
budoux = ["models/*.json", "skip_nodes.json", "py.typed"]

[dependency-groups]
dev = [
    "budoux[dev]",
]

[tool.ruff]
indent-width = 2
exclude = ["*.md"]

[tool.ruff.format]
quote-style = "preserve"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pyrefly]
python-version = "3.12"
preset = "legacy"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = [
    "I",
    "E",
    "W",
    "F",
    "UP",
    "RUF",
    "C4",
    "SIM",
    "FURB",
    "PIE",
    "PLR1722",
    "EXE",
    "PYI",
    "TRY002",
    "TRY004",
]
ignore = [
    "E501", # Line too long (handled by yapf)
    "RUF001", # String contains ambiguous character (e.g. fullwidth punctuation in test data)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/tests/test_train.py" = ["E402"]
