[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budoux"
dynamic = ["version"]
description = "BudouX is the successor of Budou"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Shuhei Iitsuka", email = "tushuhei@google.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = []

[tool.pyrefly.errors]
no-any-return = "error"
redundant-cast = "warn"

[project.optional-dependencies]
jaxcpu = [
    "jax>=0.9.0; python_version >= '3.12'",
]
dev = [
    "build",
    "google-genai",
    "pydantic",
    "pytest",
    "regex",
    "toml",
    "twine",
    "types-regex",
    "types-setuptools",
    "yapf",
    "jax>=0.9.0; python_version >= '3.12'",
    "pyrefly>=1.2.0",
    "ruff>=0.16.2",
]

[project.scripts]
budoux = "budoux.main:main"

[tool.setuptools.dynamic]
version = {attr = "budoux.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["budoux*"]

[tool.setuptools.package-data]
budoux = ["models/*.json", "skip_nodes.json", "py.typed"]

[dependency-groups]
dev = [
    "budoux[dev]",
]

[tool.yapf]
based_on_style = "yapf"


[tool.pyrefly]
python-version = "3.12"
preset = "legacy"

[tool.ruff.lint]
extend-select = [
    "I",
    "E",
    "W",
    "F",
    "UP",
    "RUF",
]
ignore = [
    "E402", # Module level import not at top of file (module hack)
    "E501", # Line too long (handled by yapf)
    "RUF001", # String contains ambiguous character (e.g. fullwidth punctuation in test data)
    "RUF005", # Consider iterable unpacking instead of concatenation
    "RUF012", # Mutable default value for class attribute
    "UP015", # Unnecessary mode argument (e.g. open(..., 'r'))
    "UP031", # Use format specifiers instead of percent format
    "UP032", # [*] Use f-string instead of `format` call
    "UP034", # [*] Avoid extraneous parentheses
    "C401", # Unnecessary generator (rewrite as a set comprehension)
    "C402", # Unnecessary generator (rewrite as a dict comprehension)
    "C408", # Unnecessary `dict()` call (rewrite as a literal)
    "C419", # Unnecessary list comprehension
    "EXE001", # Shebang is present but file is not executable
    "FURB122", # [*] Use of `f.write` in a for loop
    "PIE804", # [*] Unnecessary `dict` kwargs
    "PLR1722", # Use `sys.exit()` instead of `exit`
    "PYI034", # `__enter__` methods in classes like `ColabRunner` usually return `self` at runtime
    "PYI036", # The argument in `__exit__` should be annotated with `object` or `type[BaseException] | None`
    "SIM115", # Use a context manager for opening files
    "SIM117", # [*] Use a single `with` statement with multiple contexts instead of nested `with` statements
    "SIM118", # Use `key in dict` instead of `key in dict.keys()`
    "SIM201", # Use `...` instead of `...`
    "TRY002", # Create your own exception
    "TRY004", # Prefer `TypeError` exception for invalid type
]
